name: Release

# Runs when a change reaches main. The version bump and its CHANGELOG.md
# section were already merged: CI's version job commits them to dev on the
# dev-to-main pull request (.github/scripts/release.mjs). This job publishes
# the GitHub release for that version, tagged vX.Y.Z on the commit that
# reached main. A merge that bumps nothing finds its tag already there and
# publishes nothing.
on:
  push:
    branches: [main]
  # To publish again after a failed run. Only main publishes.
  workflow_dispatch:

# Each job asks for only what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and releases
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish the release for plugin.json's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json's version '$VERSION' is not an x.y.z version."
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released; nothing to publish."
            exit 0
          fi
          node .github/scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published $TAG."
