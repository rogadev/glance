name: Release

# Runs when a change reaches main. Release Please reads the conventional
# commits (feat:, fix:, and so on) since the last release and keeps a release
# pull request open with the version bump and CHANGELOG.md. Merging that pull
# request tags the version and publishes the GitHub release.
on:
  push:
    branches: [main]

# Each job asks for only what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, and releases
      pull-requests: write # the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to a commit: this action holds write access. Dependabot bumps it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      # The release pull request is opened with the built-in token, so GitHub
      # holds its CI run for approval: approve it on the pull request (see the
      # README's release steps). A dispatched CI run doesn't help: the pull
      # request shows only the newest run, which is the one waiting.

  sync-dev:
    # The release commit (version bump, CHANGELOG.md) lands on main only.
    # Bring it back to dev so the next dev-to-main pull request starts level.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushing the merge to dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin dev
